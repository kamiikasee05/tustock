<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUSTOCK Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#10131a;--surface:#1d2027;--surface-high:#252830;--surface-highest:#2e3138;--primary:#adc6ff;--primary-container:#4d8eff;--on-surface:#e1e2ec;--on-surface-variant:#8b95a5;--outline:rgba(255,255,255,0.12);--glass:rgba(30,41,59,0.7);--glass-blur:blur(12px);--radius-sm:8px;--radius-md:12px;--radius-lg:16px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--on-surface);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button{font-family:'Inter',sans-serif}
a{color:var(--primary-container);text-decoration:none}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--glass);backdrop-filter:var(--glass-blur);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:40px 32px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.login-logo svg{width:32px;height:32px}
.login-logo span{font-size:20px;font-weight:700;color:var(--on-surface)}
.login-sub{font-size:13px;color:var(--on-surface-variant);margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.form-group input{width:100%;padding:10px 14px;background:#0b0e15;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:14px;outline:none;transition:border .2s}
.form-group input:focus{border-color:var(--primary-container)}
.form-group input::placeholder{color:var(--on-surface-variant)}
.btn{width:100%;padding:11px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-primary{background:var(--primary-container);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--outline);margin-top:8px}
.btn-ghost:hover{background:rgba(255,255,255,0.04)}
.error{color:#f87171;font-size:13px;margin-bottom:12px}
.tab-bar{display:flex;gap:0;margin-bottom:20px;background:var(--surface);border-radius:var(--radius-sm);padding:3px}
.tab-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--on-surface-variant);transition:all .2s}
.tab-btn.active{background:var(--primary-container);color:#fff}

.dashboard{min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--outline);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;backdrop-filter:var(--glass-blur)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-left svg{width:24px;height:24px}
.topbar-left span{font-size:16px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-right .last-push{font-size:11px;color:var(--on-surface-variant)}
.btn-sm{padding:6px 14px;border:1px solid var(--outline);border-radius:6px;background:transparent;color:var(--on-surface-variant);font-size:12px;cursor:pointer;transition:all .2s}
.btn-sm:hover{border-color:var(--primary);color:var(--on-surface)}
.btn-danger-sm{padding:6px 14px;border:none;border-radius:6px;background:rgba(248,113,113,0.15);color:#f87171;font-size:12px;cursor:pointer}
.btn-danger-sm:hover{background:rgba(248,113,113,0.25)}

.content{max-width:900px;margin:0 auto;padding:20px}
.no-data{text-align:center;padding:60px 20px;color:var(--on-surface-variant)}
.no-data svg{width:48px;height:48px;margin-bottom:16px;opacity:.4}
.no-data p{font-size:14px;margin-bottom:4px}
.no-data .ts{font-size:12px;opacity:.6}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--glass);backdrop-filter:var(--glass-blur);border:1px solid var(--outline);border-radius:var(--radius-md);padding:18px 20px}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--on-surface-variant);margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:800;color:var(--on-surface)}
.kpi-sub{font-size:12px;color:var(--on-surface-variant);margin-top:4px}

.section{background:var(--glass);backdrop-filter:var(--glass-blur);border:1px solid var(--outline);border-radius:var(--radius-md);padding:20px;margin-bottom:16px}
.section-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title svg{width:16px;height:16px;color:var(--primary-container)}

.list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--outline)}
.list-item:last-child{border-bottom:none}
.list-item-left{flex:1;min-width:0}
.list-item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-meta{font-size:12px;color:var(--on-surface-variant);margin-top:2px}
.list-item-right{font-size:15px;font-weight:700;white-space:nowrap;margin-left:12px}

.stock-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--outline)}
.stock-item:last-child{border-bottom:none}
.stock-info{flex:1}
.stock-name{font-size:14px;font-weight:500}
.stock-detail{font-size:12px;color:var(--on-surface-variant);margin-top:2px}
.stock-bar-wrap{width:80px;height:6px;background:var(--surface-highest);border-radius:3px;overflow:hidden}
.stock-bar{height:100%;border-radius:3px;transition:width .4s}
.stock-bar.red{background:#f87171}
.stock-bar.amber{background:#fbbf24}
.stock-val{font-size:14px;font-weight:700;min-width:40px;text-align:right}

.debtor-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--outline)}
.debtor-item:last-child{border-bottom:none}
.debtor-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-right:10px;flex-shrink:0}
.debtor-info{flex:1}
.debtor-name{font-size:14px;font-weight:500}
.debtor-bal{font-size:15px;font-weight:700;color:#fbbf24}

.order-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--outline)}
.order-item:last-child{border-bottom:none}
.order-info{display:flex;align-items:center;gap:10px}
.order-status-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.order-meta{font-size:12px;color:var(--on-surface-variant)}
.order-right{text-align:right}
.order-amount{font-size:15px;font-weight:700}
.order-time{font-size:11px;color:var(--on-surface-variant);margin-top:2px}

.empty{text-align:center;padding:24px;color:var(--on-surface-variant);font-size:13px}
.refresh-indicator{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.delete-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--outline)}
.delete-section p{font-size:12px;color:var(--on-surface-variant);margin-bottom:8px}
.btn-delete{padding:8px 16px;border:none;border-radius:var(--radius-sm);background:rgba(248,113,113,0.12);color:#f87171;font-size:13px;cursor:pointer;font-weight:500}
.btn-delete:hover{background:rgba(248,113,113,0.2)}

.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.pos-product-list{max-height:380px;overflow-y:auto}
.pos-product-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--outline);cursor:pointer;transition:background .15s}
.pos-product-item:hover{background:rgba(255,255,255,0.03)}
.pos-product-item:last-child{border-bottom:none}
.pos-product-name{font-size:13px;font-weight:500;color:var(--on-surface)}
.pos-product-meta{font-size:11px;color:var(--on-surface-variant);margin-top:2px}
.pos-product-price{font-size:13px;color:var(--primary-container);font-weight:600;white-space:nowrap;margin-left:12px}
.pos-cart-list{max-height:240px;overflow-y:auto;margin-bottom:12px}
.pos-cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--outline)}
.pos-cart-item:last-child{border-bottom:none}
.pos-cart-info{flex:1;min-width:0}
.pos-cart-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-cart-controls{display:flex;align-items:center;gap:6px;margin-top:4px}
.pos-qty-btn{width:24px;height:24px;border:1px solid var(--outline);border-radius:4px;background:transparent;color:var(--on-surface);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pos-qty-btn:hover{border-color:var(--primary);color:var(--primary)}
.pos-qty-val{font-size:13px;font-weight:600;min-width:20px;text-align:center}
.pos-cart-right{display:flex;align-items:center;gap:8px;margin-left:12px}
.pos-cart-subtotal{font-size:13px;font-weight:600;white-space:nowrap}
.pos-cart-remove{color:#f87171;font-size:18px;cursor:pointer;padding:2px;transition:opacity .15s}
.pos-cart-remove:hover{opacity:.7}
.pos-total{font-size:18px;font-weight:700;text-align:right;padding:10px 0;border-top:2px solid var(--outline)}
.pos-pay-label{font-size:12px;color:var(--on-surface-variant);margin-bottom:6px}
.pos-pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pos-pay-btn{padding:8px;border:1px solid var(--outline);border-radius:var(--radius-sm);background:transparent;color:var(--on-surface);font-size:12px;cursor:pointer;text-transform:capitalize;transition:all .15s}
.pos-pay-btn:hover{border-color:var(--primary)}
.pos-pay-active{border-color:var(--primary-container);background:rgba(77,142,255,0.15);color:var(--primary-container)}
.pos-send-btn{width:100%;padding:12px;background:linear-gradient(135deg,#4d8eff,#7c5cff);border:none;border-radius:10px;color:white;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.pos-send-btn:hover{opacity:.88}
.pos-send-disabled{opacity:.5;cursor:default}
.pos-toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:100;animation:fadeIn .3s}
.pos-toast-ok{background:rgba(74,222,128,0.9);color:#000}
.pos-toast-err{background:rgba(248,113,113,0.9);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:480px){
.content{padding:14px}
.grid{grid-template-columns:1fr 1fr}
.kpi-value{font-size:22px}
.topbar{padding:12px 14px}
.pos-grid{grid-template-columns:1fr}
.pos-pay-grid{grid-template-columns:1fr 1fr}
}
.nav-tabs{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--outline);padding:0 20px;position:sticky;top:51px;z-index:9}
.nav-tab{padding:12px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--on-surface-variant);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.nav-tab:hover{color:var(--on-surface)}
.nav-tab.active{color:var(--primary-container);border-bottom-color:var(--primary-container)}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{padding:8px 12px;background:#0b0e15;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:13px;outline:none;transition:border .2s}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--primary-container)}
.filter-bar input{flex:1;min-width:150px}
.filter-bar select{min-width:120px}
.filter-bar label{font-size:12px;color:var(--on-surface-variant);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.inv-table{width:100%;border-collapse:collapse;font-size:13px}
.inv-table th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--on-surface-variant);padding:8px 10px;border-bottom:1px solid var(--outline)}
.inv-table td{padding:10px;border-bottom:1px solid var(--outline)}
.inv-table tr:last-child td{border-bottom:none}
.inv-table .num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.badge-ok{background:rgba(74,222,128,0.15);color:#4ade80}
.badge-low{background:rgba(251,191,36,0.15);color:#fbbf24}
.badge-out{background:rgba(248,113,113,0.15);color:#f87171}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--outline)}
.pagination button{padding:6px 12px;border:1px solid var(--outline);border-radius:6px;background:transparent;color:var(--on-surface-variant);font-size:12px;cursor:pointer;transition:all .2s}
.pagination button:hover:not(:disabled){border-color:var(--primary);color:var(--on-surface)}
.pagination button:disabled{opacity:.4;cursor:default}
.pagination .page-info{font-size:12px;color:var(--on-surface-variant)}
@media(max-width:600px){.filter-bar{flex-direction:column}.filter-bar input{min-width:0;width:100%}.nav-tabs{padding:0 14px}.nav-tab{font-size:12px;padding:10px 10px}.inv-table th,.inv-table td{padding:8px 6px;font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.location.origin;
let state = {view:'login',token:localStorage.getItem('tm_token')||'',email:'',password:'',name:'',data:null,lastPush:'',error:'',loading:false,tab:'register',refreshTimer:null,dashboardTab:'dashboard',inventory:null,invPage:1,invSearch:'',invCategory:'',invLowOnly:false,invCategories:[],posProducts:[],posCart:[],posSearch:'',posPaymentMethod:'efectivo',posCustomer:'',posCustomerId:null,posSending:false,posToast:null};
const $ = s => document.getElementById(s);
const h = t => {const d=document.createElement('div');d.textContent=t;return d.innerHTML};

function api(path,opts={}){
  const headers={'Content-Type':'application/json'};
  if(state.token) headers['Authorization']='Bearer '+state.token;
  return fetch(API+path,{...opts,headers:{...headers,...(opts.headers||{})}}).then(r=>r.json());
}

function render(){
  const app = $('app');
  if(state.view==='login') renderLogin(app);
  else renderDashboard(app);
}

function renderLogin(app){
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#4d8eff"/><path d="M9 12h14M9 16h10M9 20h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span>TUSTOCK</span>
      </div>
      <div class="login-sub">Monitor de tu negocio</div>
      <div class="tab-bar">
        <button class="tab-btn ${state.tab==='register'?'active':''}" onclick="state.tab='register';render()">Crear cuenta</button>
        <button class="tab-btn ${state.tab==='login'?'active':''}" onclick="state.tab='login';render()">Ingresar</button>
      </div>
      ${state.error?'<div class="error">'+h(state.error)+'</div>':''}
      ${state.tab==='register'?`
        <div class="form-group"><label>Email</label><input id="re" type="email" placeholder="tu@email.com" value="${h(state.email)}" /></div>
        <div class="form-group"><label>Nombre del negocio</label><input id="rn" placeholder="Mi Kiosco" value="${h(state.name)}" /></div>
        <div class="form-group"><label>Contraseña</label><input id="rp" type="password" placeholder="Mínimo 6 caracteres" value="${h(state.password)}" /></div>
        <div style="margin-bottom:16px;display:flex;align-items:flex-start;gap:8px">
          <input id="rt" type="checkbox" style="margin-top:3px;accent-color:#4d8eff" />
          <label for="rt" style="font-size:12px;color:#8b95a5;line-height:1.5;cursor:pointer">Acepto los <a href="/api/licenses/terms" target="_blank">Términos y Condiciones</a> y la <a href="/api/licenses/privacy" target="_blank">Política de Privacidad</a></label>
        </div>
        <button class="btn btn-primary" onclick="doRegister()">Crear cuenta</button>
      `:`
        <div class="form-group"><label>Email</label><input id="le" type="email" placeholder="tu@email.com" value="${h(state.email)}" /></div>
        <div class="form-group"><label>Contraseña</label><input id="lp" type="password" placeholder="Contraseña" value="${h(state.password)}" /></div>
        <button class="btn btn-primary" onclick="doLogin()">Ingresar</button>
      `}
    </div>
  </div>`;
  const firstInput = state.tab==='register' ? $('re') : $('le');
  if(firstInput) firstInput.focus();
  document.querySelectorAll('.login-card input').forEach(inp => {
    inp.addEventListener('keydown', e => { if(e.key==='Enter'){ state.tab==='register'?doRegister():doLogin(); }});
  });
}

function doLogin(){
  state.email = ($('le')||{}).value||'';
  state.password = ($('lp')||{}).value||'';
  if(!state.email||!state.password){state.error='Completá email y contraseña';render();return;}
  state.error='';state.loading=true;render();
  fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:state.email,password:state.password})})
  .then(r=>r.json()).then(d=>{
    if(d.token){state.token=d.token;state.view='dashboard';localStorage.setItem('tm_token',d.token);state.email='';state.password='';fetchData();state.refreshTimer=setInterval(fetchData,30000);}
    else{state.error=d.detail||'Credenciales inválidas';}
    state.loading=false;render();
  }).catch(()=>{state.error='Error de conexión';state.loading=false;render();});
}

function doRegister(){
  state.email = ($('re')||{}).value||'';
  state.name = ($('rn')||{}).value||'';
  state.password = ($('rp')||{}).value||'';
  const acceptsTerms = ($('rt')||{}).checked||false;
  if(!state.email||!state.password||!state.name){state.error='Completá todos los campos';render();return;}
  if(state.password.length<6){state.error='La contraseña debe tener al menos 6 caracteres';render();return;}
  if(!acceptsTerms){state.error='Debés aceptar los Términos y Condiciones y la Política de Privacidad';render();return;}
  state.error='';state.loading=true;render();
  fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:state.email,password:state.password,name:state.name,accepts_terms:true})})
  .then(r=>r.json()).then(d=>{
    if(d.ok){
      fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:state.email,password:state.password})})
      .then(r=>r.json()).then(d2=>{
        if(d2.token){state.token=d2.token;state.view='dashboard';localStorage.setItem('tm_token',d2.token);state.email='';state.password='';state.name='';fetchData();state.refreshTimer=setInterval(fetchData,30000);}
        state.loading=false;render();
      });
    } else {state.error=d.detail||'Error al crear cuenta';state.loading=false;render();}
  }).catch(()=>{state.error='Error de conexión';state.loading=false;render();});
}

function logout(){
  clearInterval(state.refreshTimer);
  state.token='';state.view='dashboard';state.data=null;state.inventory=null;state.dashboardTab='dashboard';state.invPage=1;state.invSearch='';state.invCategory='';state.invLowOnly=false;state.posProducts=[];state.posCart=[];state.posSearch='';state.posPaymentMethod='efectivo';state.posCustomer='';state.posCustomerId=null;state.posSending=false;state.posToast=null;
  localStorage.removeItem('tm_token');render();
}

function fetchData(){
  if(!state.token||state.view!=='dashboard') return;
  api('/api/metrics').then(d=>{
    if(d.detail==='Not authenticated'){logout();return;}
    state.data=d;
    state.lastPush=d.last_push||'';
    render();
  }).catch(()=>{});
}

function fetchInventory(){
  if(!state.token||state.view!=='dashboard') return;
  const params = new URLSearchParams({page:state.invPage,per_page:20});
  if(state.invSearch) params.set('search',state.invSearch);
  if(state.invCategory) params.set('category',state.invCategory);
  if(state.invLowOnly) params.set('low_only','true');
  api('/api/inventory?'+params.toString()).then(d=>{
    if(d.detail==='Not authenticated'){logout();return;}
    state.inventory=d;
    state.invCategories=d.categories||[];
    render();
  }).catch(()=>{});
}

function fmt$(n){return '$'+Number(n||0).toLocaleString('es-AR');}
function fmtTime(iso){
  if(!iso)return '';
  try{const d=new Date(iso);return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
  catch{return iso;}
}

function deleteAccount(){
  if(!confirm('¿Eliminar tu cuenta y todos tus datos? Esta acción no se puede deshacer.')) return;
  const pass = prompt('Escribí tu contraseña para confirmar:');
  if(!pass) return;
  api('/api/business/delete-account',{method:'POST',body:JSON.stringify({password:pass})})
  .then(d=>{if(d.ok){logout();}else{alert(d.detail||'Error al eliminar');}})
  .catch(()=>alert('Error de conexión'));
}

function renderInventorySection(){
  const inv = state.inventory;
  if(!inv) return `<div class="content"><div class="section"><div class="empty">Cargando inventario...</div></div></div>`;
  const products = inv.products||[];
  const catOpts = state.invCategories.map(c=>`<option value="${h(c)}" ${state.invCategory===c?'selected':''}>${h(c)}</option>`).join('');

  let tableRows = '';
  if(products.length===0){
    tableRows = `<tr><td colspan="6" class="empty">No se encontraron productos</td></tr>`;
  } else {
    tableRows = products.map(p=>{
      const stock = p.stock||0;
      const minStock = p.min_stock||0;
      let badge = '<span class="badge badge-ok">OK</span>';
      if(stock<=0) badge = '<span class="badge badge-out">Sin stock</span>';
      else if(stock<=minStock) badge = '<span class="badge badge-low">Bajo</span>';
      return `<tr>
        <td>${h(p.name)}</td>
        <td>${h(p.code||'')}</td>
        <td>${h(p.category)}</td>
        <td class="num">${fmt$(p.price)}</td>
        <td class="num">${stock} ${h(p.unit||'un')}</td>
        <td>${badge}</td>
      </tr>`;
    }).join('');
  }

  const page = inv.page||1;
  const pages = inv.pages||1;
  const total = inv.total||0;

  return `
  <div class="content">
    <div class="grid">
      <div class="kpi">
        <div class="kpi-label">Total Productos</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-sub">${inv.truncated?'Mostrando primeros 500':'Todos los productos'}</div>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" placeholder="Buscar por nombre o código..." value="${h(state.invSearch)}" oninput="state.invSearch=this.value;state.invPage=1;fetchInventory()" />
      <select onchange="state.invCategory=this.value;state.invPage=1;fetchInventory()">
        <option value="">Todas las categorías</option>
        ${catOpts}
      </select>
      <label><input type="checkbox" ${state.invLowOnly?'checked':''} onchange="state.invLowOnly=this.checked;state.invPage=1;fetchInventory()" /> Solo stock bajo</label>
    </div>

    <div class="section" style="overflow-x:auto">
      <table class="inv-table">
        <thead><tr>
          <th>Nombre</th><th>Código</th><th>Categoría</th><th class="num">Precio</th><th class="num">Stock</th><th>Estado</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>

      ${pages>1 ? `
      <div class="pagination">
        <button ${page<=1?'disabled':''} onclick="state.invPage=${page-1};fetchInventory()">← Anterior</button>
        <span class="page-info">${page} / ${pages}</span>
        <button ${page>=pages?'disabled':''} onclick="state.invPage=${page+1};fetchInventory()">Siguiente →</button>
      </div>`:''}
    </div>
  </div>`;
}

function renderPedidosSection(d){
  const orders = (d&&d.data)?(d.data.pending_orders||[]):[];
  if(orders.length===0) return `<div class="content"><div class="section"><div class="empty">No hay pedidos pendientes</div></div></div>`;
  const orderHtml = orders.map(o=>{
    const st = o.status||'pending';
    const stLabel = {pending:'Pendiente',approved:'Aprobado',rejected:'Rechazado'}[st]||st;
    const stColor = {pending:'#fbbf24',approved:'#4ade80',rejected:'#f87171'}[st]||'#8b95a5';
    return `
    <div class="order-item">
      <div class="order-info">
        <div class="order-status-badge" style="background:${stColor}22;color:${stColor}">${h(stLabel)}</div>
        <div class="order-meta">Pedido #${o.id}</div>
      </div>
      <div class="order-right">
        <div class="order-amount">${fmt$(o.total)}</div>
        <div class="order-time">${fmtTime(o.created_at)}</div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="content">
    <div class="section">
      <div class="section-title">
        <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6M8 5v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Pedidos Pendientes
      </div>
      ${orderHtml}
    </div>
  </div>`;
}

function fetchPosData(){
  if(!state.token) return;
  api('/api/inventory?per_page=500').then(d=>{
    state.posProducts = (d.products||[]);
    render();
  }).catch(()=>{});
}

function posAddItem(code){
  var p = state.posProducts.find(function(x){return x.code===code;});
  if(!p) return;
  var existing = state.posCart.find(function(x){return x.code===code;});
  if(existing){ existing.quantity++; }
  else { state.posCart.push({code:p.code,name:p.name,unit_price:p.price,quantity:1}); }
  render();
}

function posRemoveItem(code){
  state.posCart = state.posCart.filter(function(x){return x.code!==code;});
  render();
}

function posQty(code,delta){
  var item = state.posCart.find(function(x){return x.code===code;});
  if(!item) return;
  item.quantity = Math.max(1, item.quantity + delta);
  render();
}

function handleCustomerSelect(el) {
  var val = el.value;
  var otherInput = document.getElementById('posOtherCustomer');
  if (val === 'other') {
    state.posCustomerId = null;
    state.posCustomer = '';
    if (otherInput) { otherInput.style.display = 'block'; otherInput.focus(); }
  } else if (val === '') {
    state.posCustomerId = null;
    state.posCustomer = '';
    if (otherInput) { otherInput.style.display = 'none'; }
  } else {
    var customers = (state.data && state.data.data && state.data.data.customers) || [];
    var c = customers.find(function(x){ return String(x.id) === String(val); });
    state.posCustomerId = parseInt(val);
    state.posCustomer = c ? c.name : '';
    if (otherInput) { otherInput.style.display = 'none'; }
  }
}

function posSendOrder(){
  if(state.posCart.length===0 || state.posSending) return;
  state.posSending = true;
  render();

  var payload = {
    items: state.posCart.map(function(x){return {product_code:x.code,name:x.name,quantity:x.quantity,unit_price:x.unit_price};}),
    payment_method: state.posPaymentMethod,
    customer_id: state.posCustomerId || null,
    customer_name: state.posCustomer || null,
    notes: "Venta remota desde Monitor"
  };

  api('/api/pos/order', {method:'POST', body:JSON.stringify(payload)}).then(function(d){
    state.posCart = [];
    state.posCustomer = '';
    state.posCustomerId = null;
    state.posSending = false;
    state.posToast = {type:'success', text:d.message||'Pedido enviado'};
    setTimeout(function(){state.posToast=null;render();}, 3000);
    render();
  }).catch(function(e){
    state.posSending = false;
    state.posToast = {type:'error', text:'Error: '+e.message};
    setTimeout(function(){state.posToast=null;render();}, 3000);
    render();
  });
}

function renderPosSection(){
  var products = state.posProducts||[];
  var cart = state.posCart||[];
  var total = cart.reduce(function(s,x){return s+x.quantity*x.unit_price;},0);
  var filtered = products.filter(function(p){
    var q = (state.posSearch||'').toLowerCase();
    return !q || p.name.toLowerCase().indexOf(q)!==-1 || (p.code||'').toLowerCase().indexOf(q)!==-1;
  });

  return `
  <div class="content">
    <div class="pos-grid">
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Agregar productos
        </div>
        <input type="text" placeholder="Buscar por nombre o código..." value="${h(state.posSearch||'')}" 
          oninput="state.posSearch=this.value;render()" 
          style="width:100%;padding:10px;background:#0b0e15;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:13px;margin-bottom:10px;outline:none" />
        <div class="pos-product-list">
          ${filtered.length===0?'<div class="empty">No hay productos</div>':''}
          ${filtered.map(function(p){return `
          <div class="pos-product-item" onclick="posAddItem('${h(p.code)}')">
            <div class="pos-product-info">
              <div class="pos-product-name">${h(p.name)}</div>
              <div class="pos-product-meta">${h(p.code||'')} · Stock: ${p.stock}</div>
            </div>
            <div class="pos-product-price">${fmt$(p.price)}</div>
          </div>`;}).join('')}
        </div>
      </div>
      
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 16 16" fill="none"><path d="M1 1h3l1.5 8h8l1.5-6H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="13" r="1" fill="currentColor"/><circle cx="12" cy="13" r="1" fill="currentColor"/></svg>
          Pedido
        </div>
        ${cart.length===0?'<div class="empty">Agregá productos desde la izquierda</div>':`
          <div class="pos-cart-list">
            ${cart.map(function(x){return `
            <div class="pos-cart-item">
              <div class="pos-cart-info">
                <div class="pos-cart-name">${h(x.name)}</div>
                <div class="pos-cart-controls">
                  <button class="pos-qty-btn" onclick="posQty('${h(x.code)}',-1)">-</button>
                  <span class="pos-qty-val">${x.quantity}</span>
                  <button class="pos-qty-btn" onclick="posQty('${h(x.code)}',1)">+</button>
                </div>
              </div>
              <div class="pos-cart-right">
                <span class="pos-cart-subtotal">${fmt$(x.quantity*x.unit_price)}</span>
                <span class="pos-cart-remove" onclick="posRemoveItem('${h(x.code)}')">&times;</span>
              </div>
            </div>`;}).join('')}
          </div>
          <div class="pos-total">Total: ${fmt$(total)}</div>
          ${state.posPaymentMethod==='fiado' ? `
          <select onchange="handleCustomerSelect(this)" style="width:100%;padding:8px 12px;background:#0b0e15;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:13px;margin:10px 0;outline:none">
            <option value="">-- Seleccionar cliente --</option>
            ${(state.data && state.data.data && state.data.data.customers || []).map(function(c){return '<option value="'+c.id+'">'+h(c.name)+' (debe '+fmt$(c.balance)+')</option>';}).join('')}
            <option value="other">Otro (escribir nombre)...</option>
          </select>
          <input type="text" id="posOtherCustomer" placeholder="Nombre del cliente" oninput="state.posCustomer=this.value" style="display:none;width:100%;padding:8px 12px;background:#0b0e15;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:13px;margin:10px 0;outline:none" />
          ` : `
          <input type="text" placeholder="Cliente (opcional)" value="${h(state.posCustomer||'')}" 
            oninput="state.posCustomer=this.value" 
            style="width:100%;padding:8px 12px;background:#0b0e15;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:13px;margin:10px 0;outline:none" />
          `}
          <div class="pos-pay-label">Cobrar con:</div>
          <div class="pos-pay-grid">
            ${['efectivo','transferencia','fiado','mercadopago'].map(function(m){return `
            <button class="pos-pay-btn ${state.posPaymentMethod===m?'pos-pay-active':''}" onclick="state.posPaymentMethod='${m}';render()">${m}</button>`;}).join('')}
          </div>
          <button class="pos-send-btn ${state.posSending?'pos-send-disabled':''}" onclick="posSendOrder()" ${state.posSending?'disabled':''}>
            ${state.posSending?'Enviando...':'ENVIAR PEDIDO'}
          </button>
        `}
      </div>
    </div>

    ${state.posToast?'<div class="pos-toast pos-toast-'+(state.posToast.type==='success'?'ok':'err')+'">'+h(state.posToast.text)+'</div>':''}
  </div>`;
}

function renderDashboard(app){
  const d = state.data;
  let content = '';

  const tabs = `
    <div class="nav-tabs">
      <button class="nav-tab ${state.dashboardTab==='dashboard'?'active':''}" onclick="state.dashboardTab='dashboard';render()">Dashboard</button>
      <button class="nav-tab ${state.dashboardTab==='inventario'?'active':''}" onclick="state.dashboardTab='inventario';if(!state.inventory)fetchInventory();render()">Inventario</button>
      <button class="nav-tab ${state.dashboardTab==='pedidos'?'active':''}" onclick="state.dashboardTab='pedidos';render()">Pedidos</button>
      <button class="nav-tab ${state.dashboardTab==='pos'?'active':''}" onclick="state.dashboardTab='pos';fetchPosData()">POS</button>
    </div>`;

  if(state.dashboardTab==='pos'){
    content = renderPosSection();
  } else if(!d || !d.has_data){
    content = `
    <div class="content">
      <div class="no-data">
        <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="#8b95a5" stroke-width="2" stroke-dasharray="4 4"/><path d="M18 24h12M24 18v12" stroke="#8b95a5" stroke-width="2" stroke-linecap="round"/></svg>
        <p>Sin datos aún</p>
        <p class="ts">${d && d.last_push ? 'Último push: '+fmtTime(d.last_push) : 'Esperando primer push del sistema local...'}</p>
      </div>
    </div>`;
  } else if(state.dashboardTab==='dashboard'){
    const sales = d.data.sales_today||{};
    const methods = d.data.by_method||[];
    const top = d.data.top_products||[];
    const low = d.data.low_stock||[];
    const debtors = d.data.debtors||[];
    const avg = sales.count>0 ? Math.round(sales.total/sales.count) : 0;

    content = `
    <div class="content">
      <div class="grid">
        <div class="kpi">
          <div class="kpi-label">Ventas Hoy</div>
          <div class="kpi-value">${sales.count||0}</div>
          <div class="kpi-sub">${fmt$(sales.total)} facturados</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Ticket Promedio</div>
          <div class="kpi-value">${fmt$(avg)}</div>
          <div class="kpi-sub">${sales.items_sold||0} productos vendidos</div>
        </div>
      </div>

      ${methods.length>0 ? `
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M1 6h14" stroke="currentColor" stroke-width="1.5"/></svg>
          Métodos de Pago
        </div>
        ${methods.map(m=>`
          <div class="list-item">
            <div class="list-item-left">
              <div class="list-item-name">${h(m.method)}</div>
              <div class="list-item-meta">${m.count} venta${m.count!==1?'s':''}</div>
            </div>
            <div class="list-item-right">${fmt$(m.total)}</div>
          </div>
        `).join('')}
      </div>`:''}

      ${top.length>0 ? `
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 12V7l5-4 5 4v5a1 1 0 01-1 1H4a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.5"/><path d="M6 13V9h4v4" stroke="currentColor" stroke-width="1.5"/></svg>
          Top Productos
        </div>
        ${top.map(p=>`
          <div class="list-item">
            <div class="list-item-left">
              <div class="list-item-name">${h(p.name)}</div>
              <div class="list-item-meta">${p.quantity} unidades</div>
            </div>
            <div class="list-item-right">${fmt$(p.total)}</div>
          </div>
        `).join('')}
      </div>`:''}

      ${low.length>0 ? `
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1v10M4 8l4 4 4-4" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 14h12" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/></svg>
          Stock Bajo
        </div>
        ${low.map(p=>{
          const pct = p.min_stock>0 ? Math.min(100,Math.round((p.current/p.min_stock)*100)) : 0;
          return `
          <div class="stock-item">
            <div class="stock-info">
              <div class="stock-name">${h(p.name)}</div>
              <div class="stock-detail">${p.current} / ${p.min_stock} ${h(p.unit||'un')}</div>
            </div>
            <div class="stock-bar-wrap"><div class="stock-bar ${pct<30?'red':'amber'}" style="width:${pct}%"></div></div>
            <div class="stock-val">${p.current}</div>
          </div>`;
        }).join('')}
      </div>`:''}

      ${debtors.length>0 ? `
      <div class="section">
        <div class="section-title">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="6" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M1 14c0-3 2-5 5-5s5 2 5 5" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M12 9c2 0 3.5 1.5 3.5 4" stroke="currentColor" stroke-width="1.2"/></svg>
          Deudores
        </div>
        ${debtors.map(d=>{
          const parts = (d.name||'').split(' ');
          const anonymized = parts.length > 1 ? parts[0] + ' ' + parts[parts.length-1][0] + '.' : d.name||'?';
          return `
          <div class="debtor-item">
            <div class="debtor-avatar">${h((d.name||'?')[0])}</div>
            <div class="debtor-info"><div class="debtor-name">${h(anonymized)}</div></div>
            <div class="debtor-bal">${fmt$(d.balance)}</div>
          </div>`;
        }).join('')}
      </div>`:''}
    </div>`;
  } else if(state.dashboardTab==='inventario'){
    content = renderInventorySection();
  } else if(state.dashboardTab==='pedidos'){
    content = renderPedidosSection(d);
  } else if(state.dashboardTab==='pos'){
    content = renderPosSection();
  }

  app.innerHTML = `
  <div class="dashboard">
    <div class="topbar">
      <div class="topbar-left">
        <svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#4d8eff"/><path d="M7 9h10M7 12h7M7 15h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>TUSTOCK</span>
      </div>
      <div class="topbar-right">
        <span class="last-push">${state.lastPush?'<span class="refresh-indicator"></span>'+fmtTime(state.lastPush):''}</span>
        <button class="btn-sm" onclick="fetchData();if(state.dashboardTab==='inventario')fetchInventory();if(state.dashboardTab==='pos')fetchPosData()">Actualizar</button>
        <button class="btn-danger-sm" onclick="logout()">Salir</button>
      </div>
    </div>
    ${tabs}
    ${content}
    <div class="content">
      <div class="delete-section">
        <p>¿Querés eliminar tu cuenta y todos tus datos del monitor?</p>
        <button class="btn-delete" onclick="deleteAccount()">Eliminar mi cuenta</button>
      </div>
    </div>
  </div>`;
}

if(state.token && state.view==='login'){
  state.view='dashboard';
  fetchData();
  state.refreshTimer=setInterval(fetchData,30000);
}
render();
</script>
</body>
</html>
