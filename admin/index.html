<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUSTOCK — Admin</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-hover: #334155;
        --border: #334155;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #ef4444;
        --warning: #f59e0b;
        --success: #22c55e;
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      input, select, button { font-family: inherit; }
      input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
      input:focus, select:focus { outline: none; border-color: var(--primary); }
      a { color: var(--primary); text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
