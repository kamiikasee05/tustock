name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Stock + POS APKs
        working-directory: android
        run: ./gradlew assembleStockDebug assemblePosDebug

      - name: Upload POS APK
        uses: actions/upload-artifact@v4
        with:
          name: tustock-pos
          path: android/app/build/outputs/apk/pos/debug/app-pos-debug.apk

      - name: Upload Stock APK
        uses: actions/upload-artifact@v4
        with:
          name: tustock-stock
          path: android/app/build/outputs/apk/stock/debug/app-stock-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "APKs #${{ github.run_number }}"
          tag_name: "apk-${{ github.run_number }}"
          files: |
            android/app/build/outputs/apk/pos/debug/app-pos-debug.apk
            android/app/build/outputs/apk/stock/debug/app-stock-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
