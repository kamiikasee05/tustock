name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      # --- Build debug APKs (siempre) ---
      - name: Build Debug APKs
        working-directory: android
        run: ./gradlew assembleStockDebug assemblePosDebug

      # --- Release signing & build (usa secrets de GitHub si existen) ---
      - name: Decode keystore and build Release APKs
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo ">>> Keystore encontrado, compilando APKs Release..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/tustock-release.jks
            echo "storeFile=app/tustock-release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            chmod +x gradlew
            ./gradlew assembleStockRelease assemblePosRelease
          else
            echo ">>> Sin keystore, solo debug (release APKs no se generan)"
          fi

      - name: Upload Debug POS APK
        uses: actions/upload-artifact@v4
        with:
          name: tustock-pos-debug
          path: android/app/build/outputs/apk/pos/debug/app-pos-debug.apk

      - name: Upload Debug Stock APK
        uses: actions/upload-artifact@v4
        with:
          name: tustock-stock-debug
          path: android/app/build/outputs/apk/stock/debug/app-stock-debug.apk

      - name: Upload Release POS APK
        if: hashFiles('android/app/build/outputs/apk/pos/release/app-pos-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tustock-pos-release
          path: android/app/build/outputs/apk/pos/release/app-pos-release.apk

      - name: Upload Release Stock APK
        if: hashFiles('android/app/build/outputs/apk/stock/release/app-stock-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tustock-stock-release
          path: android/app/build/outputs/apk/stock/release/app-stock-release.apk

      - name: Create Release (debug)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "APKs #${{ github.run_number }}"
          tag_name: "apk-${{ github.run_number }}"
          files: |
            android/app/build/outputs/apk/pos/debug/app-pos-debug.apk
            android/app/build/outputs/apk/stock/debug/app-stock-debug.apk
            android/app/build/outputs/apk/pos/release/app-pos-release.apk
            android/app/build/outputs/apk/stock/release/app-stock-release.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
